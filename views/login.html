<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin Login · Jeff's Jamaican Cuisine</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/admin/login">
    <div class="login-flag"><span></span><span></span><span></span></div>
    <h1>Jeff's Dashboard</h1>
    <p class="muted">Catering &amp; event requests</p>
    <p class="login-error" id="loginError" hidden>Wrong username or password.</p>
    <label>Username <input name="username" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Log in</button>
  </form>
  <script src="/js/admin-login.js"></script>
</body>
</html>
